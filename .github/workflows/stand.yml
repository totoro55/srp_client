name: Update test stand

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: [self-hosted, srp-stand]
    steps:
      - uses: actions/checkout@v4
      - name: Require stand settings
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\srp-stand\.env')) {
            throw 'Создайте C:\srp-stand\.env по образцу stand.env.example'
          }
      - name: Build and restart
        shell: pwsh
        run: docker compose --env-file C:\srp-stand\.env up -d --build
