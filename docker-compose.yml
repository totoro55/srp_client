# Стенд на тестовом ПК. База и LDAP читаются из C:\srp-stand\.env.
# Запуск: docker compose --env-file C:/srp-stand/.env up -d --build

name: srp-stand

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - C:/srp-stand/.env
    restart: unless-stopped

  minio:
    profiles: ["storage"]
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
