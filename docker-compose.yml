# Стенд на тестовом ПК. Пароль и LDAP читаются из C:\srp-stand\.env.
# Запуск: docker compose --env-file C:/srp-stand/.env up -d --build

name: srp-stand

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: srp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: srp
    volumes:
      - srp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srp -d srp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - C:/srp-stand/.env
    environment:
      DATABASE_URL: postgresql://srp:${POSTGRES_PASSWORD}@db:5432/srp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  srp_pg:
